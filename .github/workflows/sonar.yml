name: SonarQube C++ Analysis

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  sonar:
    runs-on: ubuntu-latest

    env:
      BUILD_WRAPPER_OUT_DIR: build_wrapper_output_directory

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install CMake
        run: sudo apt-get update && sudo apt-get install -y cmake g++

      - name: Configure C++ project
        run: cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Install SonarQube Build Wrapper
        uses: SonarSource/sonarqube-scan-action/install-build-wrapper@71a81dc219b16ac6ec9d7796d191244ab99e0300 # v6

      - name: Build C++ project with Build Wrapper
        run: |
          build-wrapper-linux-x86-64 \
            --out-dir "$BUILD_WRAPPER_OUT_DIR" \
            cmake --build build

      - name: Run SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@71a81dc219b16ac6ec9d7796d191244ab99e0300 # v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=Abis-Ahmad_sonarqbe-student-management
            -Dsonar.organization=abis-eng
            -Dsonar.sources=.
            -Dsonar.cfamily.compile-commands=${{ env.BUILD_WRAPPER_OUT_DIR }}/compile_commands.json
